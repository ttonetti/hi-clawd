<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f5; --surface:#FFFFFF; --side:#f0eee6; --ink:#141413; --muted:#5f5d57;
  --line:rgba(20,20,19,.10); --accent:#b0553a; --accent-ink:#FFFFFF; --accent-soft:rgba(217,119,87,.14);
  --orange:#d97757; --blue:#6a9bcc; --green:#788c5d; --gray:#b0aea5; --gray-lt:#e8e6dc;
  --btn:#141413; --btn-ink:#faf9f5;
  --mascot:#6a9bcc; --mascot-ink:#141413; --cheek:#d97757;
  --shadow:0 12px 32px rgba(20,20,19,.08),0 2px 6px rgba(20,20,19,.05);
  --r-sm:8px; --r-md:12px; --r-lg:20px;
  --font:"Poppins",Arial,sans-serif;
  --font-read:"Lora",Georgia,serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(0,0,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --surface:#1f1e1c; --side:#1a1917; --ink:#faf9f5; --muted:#b0aea5;
    --line:rgba(250,249,245,.12); --accent:#e8937a; --accent-ink:#141413; --accent-soft:rgba(217,119,87,.18);
    --btn:#faf9f5; --btn-ink:#141413;
    --shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1f1e1c; --side:#1a1917; --ink:#faf9f5; --muted:#b0aea5;
  --line:rgba(250,249,245,.12); --accent:#e8937a; --accent-ink:#141413; --accent-soft:rgba(217,119,87,.18);
  --btn:#faf9f5; --btn-ink:#141413;
  --shadow:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);height:100%}
body.guide-on .app{grid-template-columns:256px minmax(0,1fr) 380px}

/* ---------- sidebar ---------- */
.sidebar{background:var(--side);display:flex;flex-direction:column;padding:16px 12px;gap:8px;min-height:0;overflow-y:auto;border-right:1px solid var(--line)}
.side-new{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:left}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.side-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-radius:var(--r-sm);background:transparent;text-align:left;color:var(--ink)}
.side-item:hover{background:var(--line)}
.side-item svg{width:18px;height:18px;flex:none;color:var(--muted)}
.guide-item{font-weight:600;background:var(--accent-soft)}
.guide-item:hover{background:var(--accent-soft);filter:brightness(.97)}
.gi-mascot{width:22px;height:22px;flex:none;display:block}
.badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:var(--surface);padding:1px 8px;border-radius:999px}
.proj-child{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 40px;border-radius:var(--r-sm);font-size:15px;animation:slidein .5s var(--spring)}
.proj-child .dot{width:8px;height:8px;border-radius:50%;background:var(--mascot);flex:none}
.side-label{font-size:13px;color:var(--muted);margin:16px 12px 4px}
.recent{display:block;width:100%;text-align:left;padding:7px 12px;border:0;background:transparent;border-radius:var(--r-sm);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent:hover{background:var(--line)}
.side-foot{margin-top:auto;padding:12px;font-size:13px;color:var(--muted)}
.side-foot p{margin:0 0 10px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ---------- main ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;flex:none}
.crumb{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.crumb .pill{font-weight:600;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);animation:slidein .5s var(--spring)}
.thread{flex:1;overflow-y:auto;padding:8px 16px 24px}
.empty{max-width:680px;margin:18vh auto 0;text-align:center}
.empty h2{font-size:clamp(26px,4vw,34px);font-weight:600;letter-spacing:-.02em;margin:0}
.msgs{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;gap:12px;align-items:flex-start;animation:fadein .35s var(--out)}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:80%}
.msg.claude .av{width:28px;height:28px;flex:none;margin-top:2px}
.msg.claude .bubble{padding-top:4px;max-width:calc(100% - 40px)}
.msg.claude .bubble p{margin:0 0 10px}
.typing{display:inline-flex;gap:5px;padding:8px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.art-card{display:flex;align-items:center;gap:12px;width:100%;max-width:360px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);text-align:left}
.art-card:hover{border-color:var(--accent)}
.art-ico{width:36px;height:36px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.art-ico svg{width:18px;height:18px}
.art-card strong{display:block;font-weight:600;line-height:1.3}
.art-card small{color:var(--muted);font-size:13px}
.composer-wrap{flex:none;padding:0 16px 16px}
.composer{max-width:680px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 10px 10px 16px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;outline:0;background:transparent;resize:none;max-height:160px;padding:6px 0;line-height:1.45}
.send{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:default}
.send svg{width:18px;height:18px}
.icon-btn{width:36px;height:36px;border:0;border-radius:var(--r-sm);background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.only-mobile{display:none}

/* ---------- artifact panel ---------- */
.artifact{position:absolute;top:0;right:0;bottom:0;width:min(560px,58%);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .45s var(--out);z-index:5;box-shadow:var(--shadow)}
.artifact.open{transform:none}
.art-head{display:flex;align-items:flex-start;gap:8px;padding:16px 16px 12px 24px;border-bottom:1px solid var(--line)}
.art-head .t{flex:1;min-width:0}
.art-kind{margin:0;font-size:13px;color:var(--muted)}
.art-head h3{margin:2px 0 0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.btn-quiet{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;font-size:14px;font-weight:600}
.btn-quiet:hover{border-color:var(--ink)}
.art-body{flex:1;overflow-y:auto;padding:20px 24px 32px;max-width:72ch}
.art-body h3{font-size:17px;font-weight:600;margin:20px 0 6px}
.art-body p{margin:0 0 12px}
.art-body ul,.art-body ol{margin:0 0 12px;padding-left:22px}
.art-body li{margin-bottom:4px}
.art-foot{padding:10px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.diagram{margin:16px 0 20px}
.diagram figcaption{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px}
.diagram svg{width:100%;max-width:460px;height:auto;display:block;font-family:var(--font)}
.skeleton{height:12px;border-radius:6px;background:var(--line);margin:10px 0;animation:shimmer 1.4s infinite ease-in-out}

/* ---------- coach (guide) ---------- */
.coach{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
.coach-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 20px;flex:none}
.coach-mascot{width:48px;height:48px;flex:none}
.coach-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.coach-name{font-weight:600}
.coach-step{font-size:13px;color:var(--muted)}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 20px 4px;flex:none}
.progress i{height:4px;border-radius:2px;background:var(--line);transition:background .4s var(--out)}
.progress i.on{background:var(--accent)}
.coach-body{flex:1;overflow-y:auto;padding:16px 20px 24px;animation:fadein .35s var(--out)}
.coach-body h2{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.25;margin:0 0 8px}
.coach-body p{margin:0 0 14px;color:var(--ink)}
.coach-body .soft{color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:15px}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:10px 12px;outline:0;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:120px;resize:vertical;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tasks{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.task{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 14px;text-align:left;transition:border-color .15s}
.task:hover{border-color:var(--accent)}
.privacy{background:var(--bg);border-radius:var(--r-md);padding:14px 16px;margin:4px 0 18px}
.privacy strong{display:block;font-size:15px;margin-bottom:6px}
.privacy ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.privacy li{margin-bottom:3px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.btn{border:0;border-radius:var(--r-md);padding:12px 16px;font-weight:600;text-align:center;transition:transform .15s var(--out)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--ink)}
.done-list{list-style:none;padding:0;margin:0 0 16px}
.done-list li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.done-list svg{width:20px;height:20px;flex:none;color:var(--accent);margin-top:2px}
.loader{display:flex;gap:6px;margin:8px 0 16px}
.loader i{width:9px;height:9px;border-radius:50%;background:var(--mascot);animation:dot 1.2s infinite ease-in-out}
.loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}

/* ---------- welcome overlay ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(20,22,26,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein .3s var(--out)}
.welcome{position:relative;width:min(460px,100%);max-height:100%;overflow-y:auto;background:var(--surface);border-radius:24px;padding:28px 28px 24px;box-shadow:var(--shadow)}
.welcome .lang{position:absolute;top:16px;right:16px}
.w-mascot{width:112px;height:112px;margin:4px 0 12px;animation:pop .8s var(--spring) both}
.welcome h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0 0 10px}
.welcome p{margin:0 0 16px}
.w-steps-title{font-weight:600;margin:0 0 8px}
.w-steps{margin:0 0 8px;padding:0;list-style:none;counter-reset:s}
.w-steps li{counter-increment:s;display:flex;align-items:center;gap:12px;padding:7px 0}
.w-steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.w-time{font-size:14px;color:var(--muted)}
.w-recall{font-size:14px;color:var(--muted);margin:14px 0 0!important}

/* ---------- Claude mascot ---------- */
.mascot{width:100%;height:100%;overflow:visible;display:block}
.clawd-body{fill:#f45d48}
.clawd-eye{fill:#141413;transform-box:fill-box;transform-origin:center}
.clawd-core{transform-box:view-box;transform-origin:60px 66px;animation:clawdBreathe 3.2s ease-in-out infinite}
.clawd-eyes{transform-box:view-box;transform-origin:60px 45px;animation:clawdBlink 5.2s infinite}
.clawd-arm-left,.clawd-arm-right{transform-box:view-box}
.clawd-arm-left{transform-origin:26px 61px}
.clawd-arm-right{transform-origin:94px 61px}
.clawd-spark{fill:var(--orange);opacity:0;transform-box:fill-box;transform-origin:center}
.clawd-shadow{fill:rgba(20,20,19,.12);transform-box:fill-box;transform-origin:center;animation:clawdShadow 3.2s ease-in-out infinite}

/* Claude reacts to the onboarding instead of just idling. */
.mascot.waving .clawd-arm-right{animation:clawdWave .55s ease-in-out 4 .35s}
.mascot.waving .clawd-core{animation:clawdHello .9s var(--spring) both,clawdBreathe 3.2s ease-in-out 1s infinite}
.mascot.thinking .clawd-eyes{animation:clawdThink 1.7s ease-in-out infinite}
.mascot.thinking .clawd-core{animation:clawdThinkBob 1.7s ease-in-out infinite}
.mascot.happy .clawd-core{animation:clawdHappy 1.15s var(--spring) 1,clawdBreathe 3.2s ease-in-out 1.15s infinite}
.mascot.happy .clawd-eye{animation:clawdHappyEyes 1.15s ease-in-out 1}
.mascot.celebrate .clawd-core{animation:clawdCelebrate .75s var(--spring) 2}
.mascot.celebrate .clawd-arm-left{animation:clawdCheerL .75s ease-in-out 2}
.mascot.celebrate .clawd-arm-right{animation:clawdCheerR .75s ease-in-out 2}
.mascot.celebrate .clawd-spark{animation:clawdSpark 1.5s ease-out 1}
.mascot.gentle .clawd-core{animation:clawdGentle 2.6s ease-in-out infinite}
.mascot.gentle .clawd-eyes{animation:clawdSoftBlink 3.8s ease-in-out infinite}

.clawd-wrap{position:relative}
.clawd-wrap::after{content:"";position:absolute;inset:-8px;border-radius:50%;background:var(--accent-soft);opacity:0;transform:scale(.72);z-index:-1}
.clawd-wrap.is-encouraging::after{animation:clawdGlow 1.4s ease-out 1}

@keyframes clawdBreathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.015)}}
@keyframes clawdShadow{0%,100%{transform:scaleX(1);opacity:.12}50%{transform:scaleX(.88);opacity:.08}}
@keyframes clawdBlink{0%,45%,48%,100%{transform:scaleY(1)}46%,47%{transform:scaleY(.08)}}
@keyframes clawdWave{0%,100%{transform:rotate(0)}45%{transform:rotate(-20deg)}70%{transform:rotate(9deg)}}
@keyframes clawdHello{0%{transform:translateY(12px) scale(.72);opacity:0}70%{transform:translateY(-4px) scale(1.06);opacity:1}100%{transform:none;opacity:1}}
@keyframes clawdThink{0%,100%{transform:translateX(0)}35%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
@keyframes clawdThinkBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(-2deg)}}
@keyframes clawdHappy{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-7px) scale(1.05)}}
@keyframes clawdHappyEyes{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.48) scaleX(1.12)}}
@keyframes clawdCelebrate{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-11px) scale(1.08)}}
@keyframes clawdCheerL{0%,100%{transform:rotate(0)}45%{transform:rotate(16deg)}}
@keyframes clawdCheerR{0%,100%{transform:rotate(0)}45%{transform:rotate(-16deg)}}
@keyframes clawdSpark{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1.15) rotate(18deg)}100%{opacity:0;transform:scale(.7) rotate(45deg)}}
@keyframes clawdGentle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(.98)}}
@keyframes clawdSoftBlink{0%,88%,100%{transform:scaleY(1)}92%,96%{transform:scaleY(.35)}}
@keyframes clawdGlow{0%{opacity:0;transform:scale(.72)}35%{opacity:.7}100%{opacity:0;transform:scale(1.2)}}

/* ---------- toast & highlights ---------- */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;z-index:80;transition:transform .35s var(--spring);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.pulse{animation:ring 1.4s var(--out) 2}
.scrim{display:none}

/* ---------- v2 ---------- */
.side-comfort{margin:12px 0 6px;font-weight:600;color:var(--ink)}
.sidebar .chips{gap:6px}
.sidebar .chip{font-size:13px;padding:4px 10px}
.w-prefs{margin:4px 0 16px}
.w-prefs .chips{margin:8px 0 6px}
.mic.on{background:var(--accent-soft);color:var(--accent)}
body.pref-voice .mic{color:var(--accent)}
.prog{flex:1;overflow-y:auto;padding:8px 16px 48px}
.prog-inner{max-width:720px;margin:0 auto}
.prog h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.prog .soft{color:var(--muted)}
.today{margin:18px 0 12px}
.today-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:8px}
.today-bar i{display:block;height:100%;background:var(--mascot);border-radius:4px;transition:width .6s var(--out)}
.paused{background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:var(--r-md);font-weight:600}
.sim{border:1px dashed var(--line);border-radius:var(--r-md);padding:14px 16px;margin:16px 0 8px;background:var(--surface)}
.sim p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.sim-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn-sm{padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.week{margin-top:28px}
.week h2{font-size:19px;font-weight:600;margin:0 0 10px}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.mission.is-locked{opacity:.6}
.m-day{font-size:13px;font-weight:700;color:var(--accent);width:52px;flex:none}
.m-text{flex:1;min-width:0;display:flex;flex-direction:column}
.m-text span{font-size:14px;color:var(--muted)}
.m-state{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;flex:none}
.m-state.done{color:var(--accent);font-weight:600}
.m-state svg{width:16px;height:16px}
.courses{display:flex;flex-direction:column;gap:10px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.course.locked{opacity:.6}
.c-top{display:flex;flex-direction:column}
.c-top span{font-size:13px;color:var(--muted)}
.course p{margin:8px 0;font-size:15px}
.c-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn-quiet-lg{border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;padding:8px 14px;font-size:15px}
.side-item .badge.count{background:var(--mascot);color:var(--mascot-ink)}
@media (max-width:600px){
  .mission{flex-wrap:wrap}
  .mission .m-state,.mission .btn{margin-left:66px}
}
/* larger text preference */
body.large .coach-body p,body.large .coach-body li,body.large .task,body.large .chip,body.large .btn,body.large .field input,body.large .field textarea,body.large .msg .bubble,body.large .art-body,body.large .composer textarea,body.large .welcome p,body.large .w-steps li,body.large .side-item,body.large .mission strong,body.large .course p{font-size:19px}
body.large .soft,body.large .m-text span,body.large .privacy ul{font-size:17px!important}
body.large .coach-body h2{font-size:26px}
body.large .welcome h1{font-size:34px}
body.large .btn{padding:15px 18px}
body.large .btn-sm{padding:11px 16px}
/* ---------- Anthropic brand layer ---------- */
h1,h2,h3,.coach-name,.art-head h3,.empty h2{font-family:var(--font);letter-spacing:-.01em}
.coach-body p,.coach-body li,.msg .bubble,.art-body,.welcome p,.w-steps li,.prog .soft,.m-text span,.course p,.privacy li,.sim p,.paused,.done-list span{font-family:var(--font-read)}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.lang button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.send{background:var(--orange);color:#141413}
.progress i.on,.today-bar i{background:var(--orange)}
.loader i{background:var(--orange)}
.guide-item{background:var(--accent-soft)}
.w-steps li::before{background:var(--accent-soft);color:var(--accent)}
.side-item .badge.count{background:var(--orange);color:#141413}
.proj-child .dot{background:var(--green)}
.task:hover,.art-card:hover{border-color:var(--orange)}
.mission.is-open{border-color:rgba(217,119,87,.45)}

/* ---------- workshop (starter logbook) ---------- */
.ws-head{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin:8px 0 20px}
.ws-head > div:first-child{flex:1 1 320px;min-width:0}
.ws-head h1{margin-top:4px}
.ws-eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ws-rank{flex:0 1 260px;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ws-lbl{font-size:13px;color:var(--muted)}
.ws-rank strong{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ws-sub{font-size:13px;color:var(--muted)}
.ws-rank .today-bar{margin:6px 0 2px}
.ws-pts{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ws-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.ws-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:500;color:var(--muted)}
.ws-tab:hover{color:var(--ink)}
.ws-tab[aria-selected="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.ws-tab .c{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}
.ws-tab.done .c{opacity:1;font-weight:700}
.ws-panel{display:flex;flex-direction:column;gap:14px}
.ws-panel h2,.ws-ask h2{font-size:22px;font-weight:600;margin:0}
.ws-panel > p{margin:0}
.ws-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.ws-qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;font-size:13px;color:var(--muted)}
.ws-scenario{font-family:var(--font-read);font-size:19px;line-height:1.45;margin:0}
.ws-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ws-choice,.ws-opt{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:12px 14px;text-align:left;transition:border-color .15s}
.ws-choice{display:flex;flex-direction:column;gap:2px}
.ws-choice b{font-weight:600}
.ws-choice span{font-size:13px;color:var(--muted)}
.ws-choice:hover:not(:disabled),.ws-opt:hover:not(:disabled){border-color:var(--orange)}
.ws-choice:disabled,.ws-opt:disabled{cursor:default;color:inherit}
.ws-opt{font-family:var(--font-read);font-size:15px;line-height:1.5}
.ws-choice.is-right,.ws-opt.is-right{background:rgba(120,140,93,.16);border-color:var(--green)}
.ws-choice.is-wrong,.ws-opt.is-wrong{background:var(--accent-soft);border-color:var(--accent)}
.ws-feedback{border-radius:var(--r-md);padding:12px 14px;background:rgba(120,140,93,.16);font-family:var(--font-read)}
.ws-feedback.no{background:var(--accent-soft)}
.ws-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ws-dots{display:flex;gap:4px;flex-wrap:wrap}
.ws-dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.ws-dots i.r{background:var(--green)}
.ws-dots i.w{background:var(--accent)}
.ws-dots i.cur{outline:1.5px solid var(--ink);outline-offset:1px}
.ws-kicker{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.ws-weak{margin:0;font-family:var(--font-read);background:var(--accent-soft);border-radius:var(--r-md);padding:10px 14px}
.ws-opts{display:flex;flex-direction:column;gap:8px}
.ws-bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ws-bgrid .field{margin:0}
.ws-bgrid .field label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ws-bgrid .field label small{font-weight:400;font-size:13px;color:var(--muted)}
.ws-bgrid .field textarea{min-height:96px}
.ws-hint{font-size:13px;color:var(--muted);min-height:1.3em}
.ws-hint.ok{color:var(--green);font-weight:600}
.ws-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ws-meter i{height:6px;border-radius:3px;background:var(--line);transition:background .3s var(--out)}
.ws-meter i.on{background:var(--orange)}
.ws-preview{margin:0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:var(--r-md);padding:12px 14px;font-family:var(--font-read);font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;min-height:60px}
.ws-preview .ph{color:var(--muted)}
.ws-flash{perspective:900px}
.ws-fc{position:relative;display:block;width:100%;height:240px;border:0;padding:0;background:none;transform-style:preserve-3d;transition:transform .45s var(--out)}
.ws-fc.flip{transform:rotateY(180deg)}
.ws-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.ws-face.back{transform:rotateY(180deg);background:var(--accent-soft);gap:4px}
.ws-face .w{font-size:clamp(26px,5vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ws-face.back .w{font-size:22px}
.ws-face.back .tag:not(:first-child){margin-top:10px}
.ws-face .s{font-family:var(--font-read);font-size:15px;color:var(--muted);max-width:44ch}
.ws-face .tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ws-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ws-known{display:flex;flex-wrap:wrap;gap:6px}
.ws-known span{font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ws-known span.k{border-color:var(--green);color:var(--ink);background:rgba(120,140,93,.16)}
.ws-check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ws-check label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer}
.ws-check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--orange)}
.ws-check .tx{font-family:var(--font-read)}
.ws-check input:checked + .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--orange)}
.ws-check .st{font-size:12px;font-weight:600;color:var(--accent);padding-top:3px;white-space:nowrap}
.ws-ask{margin-top:32px}
.ws-ask .chips{margin-top:10px}
.ws-ask .chip{text-align:left}
.ws-toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;margin-top:14px}
.ws-toggle input{accent-color:var(--orange);width:16px;height:16px;margin:0}
.ws-foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.ws-foot button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:5px 10px;font-size:13px;color:var(--muted)}
.ws-foot button:hover{border-color:var(--ink);color:var(--ink)}
/* interests and comfort */
.ws-adapt{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--accent)}
.ws-adapt.hint{font-weight:400;color:var(--muted)}
.ws-mine{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;white-space:nowrap}
.ws-check .st .ws-mine{margin-left:0}
.chip.chip-mine{border-color:var(--orange)}
.pref-label{margin:10px 0 6px;font-size:14px;font-weight:600}
.sidebar .pref-label{font-size:13px;margin:8px 0 4px;color:var(--muted)}
.pref-voice-row{margin-top:10px}
body.pace-fast .more{display:none}
body.small .coach-body p,body.small .coach-body li,body.small .task,body.small .chip,body.small .btn,body.small .field input,body.small .field textarea,body.small .msg .bubble,body.small .art-body,body.small .composer textarea,body.small .welcome p,body.small .w-steps li,body.small .side-item,body.small .mission strong,body.small .course p,body.small .ws-opt,body.small .ws-check .tx,body.small .ws-feedback,body.small .ws-preview,body.small .ws-tab,body.small .ws-weak{font-size:14px}
body.small .soft,body.small .m-text span,body.small .privacy ul{font-size:13px!important}
body.small .ws-scenario{font-size:17px}
body.small .coach-body h2{font-size:20px}
body.small .welcome h1{font-size:26px}
.coach-back{margin-left:-8px}
.actions-split{flex-direction:row;flex-wrap:wrap}
.actions-split .btn{flex:1 1 180px;text-decoration:none}
.btn-link{text-decoration:none;text-align:center}
/* coach answers in the main chat */
.msg .bubble ul{margin:0 0 10px;padding-left:20px}
.msg .bubble p:last-child,.msg .bubble ul:last-child{margin-bottom:0}
.msg .bubble code{font-size:.92em;background:var(--side);padding:1px 5px;border-radius:4px}
.coach-sep{display:block;margin:12px 0 6px;font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.coach-err{color:var(--muted);font-size:14px}
.send.is-stop{background:var(--btn);color:var(--btn-ink)}
body.large .ws-scenario{font-size:22px}
body.large .ws-opt,body.large .ws-check .tx,body.large .ws-feedback,body.large .ws-preview,body.large .ws-bgrid textarea,body.large .ws-tab,body.large .ws-weak{font-size:19px}
@media (max-width:600px){
  .ws-bgrid{grid-template-columns:minmax(0,1fr)}
  .ws-rank{flex-basis:100%}
  .ws-check label{grid-template-columns:22px minmax(0,1fr)}
  .ws-check .st{grid-column:2;padding-top:0}
}
/* ---------- adaptive heights ---------- */
@supports (height:100dvh){ body{height:100dvh} }
.overlay{place-items:safe center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
@media (max-height:720px){
  .welcome{padding:20px 20px 16px}
  .welcome .lang{top:12px;right:12px}
  .w-mascot{width:72px;height:72px;margin:0 0 8px}
  .welcome h1{font-size:26px;margin-bottom:6px}
  .welcome p{margin-bottom:10px}
  .w-steps li{padding:3px 0}
  .w-prefs{margin:2px 0 10px}
  .pref-label{margin:6px 0 4px}
}
@media (max-height:560px){
  .w-mascot{display:none}
  .welcome h1{padding-right:120px}
}
/* ---------- keyframes ---------- */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes pop{0%{transform:scale(.4) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}

.mascot:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){
  .clawd-core,.clawd-eyes,.clawd-shadow,.clawd-arm-left,.clawd-arm-right,.clawd-spark{animation:none!important}
}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .app,body.guide-on .app{grid-template-columns:minmax(0,1fr)}
  .only-mobile{display:grid}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);z-index:50;transform:translateX(-102%);transition:transform .35s var(--out);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  body.side-open .sidebar{transform:none;box-shadow:var(--shadow)}
  body.side-open .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.3)}
  .coach{position:fixed;left:0;right:0;bottom:0;max-height:64%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .45s var(--out)}
  .coach.min .coach-body,.coach.min .progress{display:none}
  .coach.min .coach-head{padding-bottom:16px}
  body.guide-on .thread{padding-bottom:58vh}
  body.guide-on.coach-min .thread{padding-bottom:24px}
  body.guide-on.coach-min .composer-wrap{padding-bottom:96px}
  .artifact{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;height:90%;border-left:0;border-radius:20px 20px 0 0;transform:translateY(102%);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
  .artifact.open{transform:none}
  .empty{margin-top:10vh}
  .welcome{padding:24px 20px 20px}
  .welcome h1{font-size:26px}
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<style id="clawd-static-override">
/* Claude: intentionally static. The mascot should feel like a visual companion,
   not an animated UI element. */
.mascot,
.mascot *,
.clawd-wrap,
.clawd-wrap::after,
.clawd-core,
.clawd-eyes,
.clawd-eye,
.clawd-shadow,
.clawd-arm-left,
.clawd-arm-right,
.clawd-spark{
  animation:none !important;
  transform:none !important;
  transition:none !important;
}
.clawd-spark{display:none !important}
.clawd-wrap::after{display:none !important}
</style>

</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <button class="side-new" id="newChat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="newChat"></span>
    </button>
    <nav class="side-nav">
      <button class="side-item guide-item" id="guideItem">
        <span class="gi-mascot" data-mascot="mini"></span>
        <span data-i18n="guide"></span>
        <span class="badge" data-i18n="new"></span>
      </button>
      <button class="side-item" id="progItem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span data-i18n="program"></span>
        <span class="badge count" id="progBadge" hidden></span>
      </button>
      <button class="side-item" id="wsItem" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 13l2 2 4-4"/></svg>
        <span data-i18n="workshop"></span>
      </button>
      <button class="side-item" data-noop>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span data-i18n="chats"></span>
      </button>
      <div>
        <button class="side-item" id="projItem" data-noop>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-i18n="projects"></span>
        </button>
        <div id="projList"></div>
      </div>
      <button class="side-item" id="artItem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span data-i18n="artifacts"></span>
      </button>
    </nav>
    <p class="side-label" data-i18n="recents"></p>
    <div id="recentList"></div>
    <div class="side-foot">
      <p data-i18n="protoNote"></p>
      <div id="sidePrefs"></div>
      <div class="lang" role="group" aria-label="Idioma · Langue · Language">
        <button data-lang="es">ES</button><button data-lang="fr">FR</button><button data-lang="en">EN</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" data-i18n-aria="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
    </header>
    <div class="thread" id="thread">
      <div class="empty" id="empty"><h2 id="greet"></h2></div>
      <div class="msgs" id="msgs"></div>
    </div>
    <div class="prog" id="programView" hidden></div>
    <div class="prog" id="workshopView" hidden></div>
    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1"></textarea>
        <button class="icon-btn mic" id="mic" data-i18n-aria="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="send" id="send" disabled data-i18n-aria="send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <section class="artifact" id="artifact" aria-hidden="true">
      <div class="art-head">
        <div class="t"><p class="art-kind" data-i18n="artifact"></p><h3 id="artTitle"></h3></div>
        <button class="btn-quiet" id="copyBtn" data-i18n="copy"></button>
        <button class="icon-btn" id="closeArt" data-i18n-aria="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="art-body" id="artBody"></div>
      <div class="art-foot" id="artFoot"></div>
    </section>
  </main>

const M = () => MISSIONS[lang];
const mission = id => M().find(m => m.id === id);

/* ================= v2: preferences ================= */
const isSlow = () => S.prefs.pace === 'slow';
const isFast = () => S.prefs.pace === 'fast';
function prefPressed(b){ return b.dataset.v ? S.prefs[b.dataset.pref] === b.dataset.v : !!S.prefs[b.dataset.pref]; }
function applyPrefs(){
  document.body.classList.toggle('large', S.prefs.size === 'large');
  document.body.classList.toggle('small', S.prefs.size === 'small');
  document.body.classList.toggle('pace-fast', isFast());
  document.body.classList.toggle('pref-voice', S.prefs.voice);
  document.querySelectorAll('[data-pref]').forEach(b => b.setAttribute('aria-pressed', prefPressed(b)));
}
function prefChips(){
  const group = (k, label, opts) => `<p class="pref-label" id="pl-${k}-${++prefUid}">${esc(label)}</p><div class="chips" role="group" aria-labelledby="pl-${k}-${prefUid}">${Object.entries(opts).map(([v,txt]) => `<button class="chip" data-pref="${k}" data-v="${v}" aria-pressed="${S.prefs[k] === v}">${esc(txt)}</button>`).join('')}</div>`;
  return group('size', t('prefSize'), L().sizes) + group('pace', t('prefPace'), L().paces)
    + `<div class="chips pref-voice-row"><button class="chip" data-pref="voice" aria-pressed="${!!S.prefs.voice}">${esc(L().prefs.voice)}</button></div>`;
}
let prefUid = 0;
function totalSteps(){ return isSlow() ? 3 : 4; }
function renderSidePrefs(){
  $('#sidePrefs').innerHTML = `<p class="side-comfort">${esc(t('comfort'))}</p>${prefChips()}`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pref]'); if (!b) return;
  const k = b.dataset.pref; S.prefs[k] = b.dataset.v || !S.prefs[k];
  applyPrefs();
  if (k === 'pace' && !$('#welcome').hidden) showWelcome();
  if (k === 'pace' || k === 'voice') renderCoach();
});

/* ================= v2: voice ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function toggleMic(){
  if (!SR){ toast(t('voiceNo')); return; }
  if (rec){ rec.stop(); return; }
  try{
    rec = new SR(); rec.lang = {es:'es-ES', fr:'fr-FR', en:'en-US'}[lang]; rec.interimResults = true;
    const base = $('#input').value ? $('#input').value + ' ' : '';
    rec.onresult = ev => { let txt = ''; for (const r of ev.results) txt += r[0].transcript; $('#input').value = base + txt; $('#input').dispatchEvent(new Event('input')); };
    rec.onerror = () => toast(t('voiceNo'));
    rec.onend = () => { rec = null; $('#mic').classList.remove('on'); $('#input').placeholder = t('placeholder'); };
    rec.start(); $('#mic').classList.add('on'); $('#input').placeholder = t('micOn');
  }catch(err){ rec = null; toast(t('voiceNo')); }
}

/* ================= v2: program ================= */
function available(){ return M().filter(m => m.day <= S.day && !S.done.has(m.id)); }
function nextDay(){ const n = M().find(m => m.day > S.day); return n ? n.day : null; }
function updateBadge(){
  const n = S.paused ? 0 : available().length;
  const b = $('#progBadge'); b.textContent = n; b.hidden = !n;
  $('#wsItem').hidden = !wsUnlocked();
}
function showProgram(){
  S.view = 'program';
  $('#programView').hidden = false; $('#workshopView').hidden = true; $('#thread').hidden = true; $('.composer-wrap').hidden = true;
  closeArtifact(); document.body.classList.remove('side-open');
  renderProgram();
}
function showChat(){
  S.view = 'chat';
  $('#programView').hidden = true; $('#workshopView').hidden = true; $('#thread').hidden = false; $('.composer-wrap').hidden = false;
}
function weekOf(d){ return d <= 7 ? 0 : d <= 14 ? 1 : d <= 21 ? 2 : 3; }
function renderProgram(){
  const ms = M();
  let weeks = '';
  for (let w = 0; w < 4; w++){
    const rows = ms.filter(m => weekOf(m.day) === w).map(m => {
      const done = S.done.has(m.id), open = m.day <= S.day;
      const state = done ? `<span class="m-state done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>${esc(t('pgDone'))}</span>`
        : open ? `<button class="btn btn-primary btn-sm" data-m="${m.id}">${esc(t('pgTry'))}</button>`
        : `<span class="m-state">${esc(t('pgLocked',{d:m.day}))}</span>`;
      return `<li class="mission ${done ? 'is-done' : open ? 'is-open' : 'is-locked'}"><span class="m-day">${esc(t('pgDay',{d:m.day}))}</span><div class="m-text"><strong>${esc(m.title)}</strong><span>${esc(m.why)}</span></div>${state}</li>`;
    }).join('');
    weeks += `<section class="week"><h2>${esc(L().weeks[w])}</h2><ul class="missions">${rows}</ul></section>`;
  }
  const courses = COURSES.map(c => {
    const on = c.unlock();
    return `<article class="course ${on ? '' : 'locked'}">
      <div class="c-top"><strong>${esc(c.name)}</strong><span>${esc(c.len[lang])}. ${esc(t('cEn'))}</span></div>
      <p>${esc(c.desc[lang])}</p>
      ${on ? `<div class="c-actions"><a class="btn btn-quiet-lg" href="${c.url}" target="_blank" rel="noopener">${esc(t('cOpen'))}</a><button class="btn btn-primary btn-sm" data-c="${c.id}">${esc(t('cPractice'))}</button></div>`
           : `<p class="m-state">${esc(t('cLocked',{w:c.when[lang]}))}</p>`}
    </article>`;
  }).join('');
  $('#programView').innerHTML = `<div class="prog-inner">
    <h1>${esc(t('pgTitle'))}</h1>
    <p class="soft">${esc(t('pgIntro'))}</p>
    <div class="today"><div class="today-bar"><i style="width:${Math.round(S.day/30*100)}%"></i></div><strong>${esc(t('pgToday',{d:S.day}))}</strong></div>
    ${S.paused ? `<p class="paused">${esc(t('pgPaused'))}</p>` : ''}
    <div class="sim"><strong>${esc(t('pgSim'))}</strong><p>${esc(t('pgSimBody'))}</p>
      <div class="sim-actions">
        <button class="btn btn-primary btn-sm" data-p="next" ${nextDay() ? '' : 'disabled'}>${esc(t('pgNext'))}</button>
        <button class="btn btn-ghost btn-sm" data-p="pause">${esc(S.paused ? t('pgResume') : t('pgPause'))}</button>
        <button class="btn btn-ghost btn-sm" data-p="reset">${esc(t('pgReset'))}</button>
      </div></div>
    ${weeks}
    <section class="week"><h2>${esc(t('coursesTitle'))}</h2><p class="soft">${esc(t('coursesIntro'))}</p><div class="courses">${courses}</div></section>
  </div>`;
  updateBadge();
}
function advance(){
  const n = nextDay(); if (!n) return;
  const wasLocked = !wsUnlocked();
  S.day = n; renderProgram();
  if (wasLocked && wsUnlocked()){ wsEnsurePersonal(); toast(t('wsOpened')); pulse($('#wsItem')); }
  else if (!S.paused){ toast(t('newChallenge')); pulse($('#progItem')); }
}
$('#programView').addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p){
    if (p.dataset.p === 'next') advance();
    if (p.dataset.p === 'pause'){ S.paused = !S.paused; renderProgram(); }
    if (p.dataset.p === 'reset'){ S.day = 1; S.done = new Set(S.firstDone ? ['first'] : []); renderProgram(); }
    return;
  }
  const m = e.target.closest('[data-m]'); if (m){ startMission(m.dataset.m); return; }
  const c = e.target.closest('[data-c]'); if (c){ practice(c.dataset.c); }
});
function startMission(id){
  const m = mission(id); if (!m) return;
  if (m.kind === 'workshop'){ S.done.add(id); updateBadge(); closeGuide(); showWorkshop(); return; }
  S.mission = id;
  if (m.kind === 'close' || m.kind === 'project' || m.kind === 'instr') showProgram(); else showChat();
  S.step = 'mission'; openGuide();
}
function missionBody(){
  const m = mission(S.mission); if (!m) return '';
  let extra = '';
  if (m.kind === 'chat' || m.kind === 'doc'){
    extra = `<div class="tasks"><button class="task" data-a="mEx">${esc(m.prompt)}</button></div><p class="soft">${esc(t('ownOr'))}</p>`;
    if (m.voice || S.prefs.voice) extra += `<p class="soft">${esc(SR ? t('voiceTip') : t('voiceNo'))}</p>`;
  } else if (m.kind === 'own'){
    extra = `<p class="soft">${esc(t('ownOr'))}</p>` + (S.prefs.voice ? `<p class="soft">${esc(SR ? t('voiceTip') : t('voiceNo'))}</p>` : '');
  } else if (m.kind === 'project'){
    extra = `<p class="soft">${esc(t('pjBody'))}</p><div class="field"><label for="mProj">${esc(t('projName'))}</label><input id="mProj" value="${esc(t('pjDefault'))}"></div><div class="actions"><button class="btn btn-primary" data-a="mProj">${esc(t('projCreate'))}</button></div>`;
  } else if (m.kind === 'instr'){
    extra = `<div class="field"><label for="mInstr">${esc(t('rLabel'))}</label><textarea id="mInstr">${esc(S.instructions || buildInstructions())}</textarea></div><div class="actions"><button class="btn btn-primary" data-a="mInstr">${esc(t('instrSave'))}</button></div>`;
  } else if (m.kind === 'close'){
    const done = M().filter(x => S.done.has(x.id) && x.id !== 'close');
    extra = done.length ? `<p>${esc(t('closeBody'))}</p><ul class="done-list">${done.map(x => `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><span>${esc(x.title)}</span></li>`).join('')}</ul>` : `<p>${esc(t('closeNone'))}</p>`;
    extra += `<p class="soft">${esc(t('closeEnd'))}</p><div class="actions"><button class="btn btn-primary" data-a="mClose">${esc(t('doneMark'))}</button></div>`;
  }
  return `<h2>${esc(m.title)}</h2><p>${esc(m.why)}</p>${extra}`;
}
async function runMission(text){
  const m = mission(S.mission); if (!m || S.busy) return;
  showChat(); go('missionWorking');
  if (m.kind === 'chat') await freeChat(text, m.fb);
  else await runTask(text, -1, m.kind === 'doc' ? m.fb : null);
  finishMission();
}
function finishMission(){
  S.done.add(S.mission); updateBadge();
  if (S.view === 'program') renderProgram();
  go('missionDone');
}
function missionDoneBody(){
  const n = nextDay();
  return `<h2>${esc(t('mDoneTitle'))}</h2><p>${esc(t('mDoneBody'))}</p><p class="soft">${esc(n ? t('mNext',{d:n}) : t('mLast'))}</p>
    <div class="actions actions-split"><button class="btn btn-primary" data-a="toProgram">${esc(t('backProgram'))}</button><a class="btn btn-quiet-lg" href="${esc(claudeUrl(mission(S.mission)))}" target="_blank" rel="noopener">${esc(t('tryClaude'))}</a></div>`;
}
// Opens the Claude app, pre-filled with the challenge's example prompt (never with what the person typed).
function claudeUrl(m){
  return 'https://claude.ai/new' + (m && m.prompt ? '?q=' + encodeURIComponent(m.prompt) : '');
}
async function practice(cid){
  const c = COURSES.find(x => x.id === cid); if (!c) return;
  showChat();
  const plan = S.profile.plan ? ({es:` (por ejemplo: ${S.profile.plan})`, fr:` (par exemple : ${S.profile.plan})`, en:` (for example: ${S.profile.plan})`})[lang] : '';
  await runTask(c.practice[lang], -1, t('practiceFallback',{c:c.name, p:plan}));
}

/* ---------- interests (from the Guide's "tell me about you" step) ---------- */
const HOBBIES = ['cooking','travel','sport','music','garden','reading','diy','family'];
const blankProfile = () => ({name:'', role:'', plan:'', goals:[], hobbies:[], hobbyOther:''});
// Travel can also come from the "Plans and trips" goal (index 4) when no hobby was picked.
function interests(){
  const P = S.profile;
  return {ids: P.hobbies.length ? P.hobbies : (P.goals.includes(4) ? ['travel'] : []), other: (P.hobbyOther || '').trim()};
}
function interestKey(){ const it = interests(); return [...it.ids, it.other.toLowerCase()].filter(Boolean).join('|'); }
function hobbyNames(l = lang){
  const P = S.profile;
  return [...P.hobbies.map(h => I18N[l].hobbies[h]), (P.hobbyOther || '').trim()].filter(Boolean).join(', ');
}
function interestNames(){
  const it = interests();
  return [...it.ids.map(h => L().hobbies[h]), it.other].filter(Boolean).join(', ');
}

function bankSet(h, l){

  };

/* ---------- personal set: generated live by Claude, else pre-written for the first hobby ---------- */
function wsPersonal(l = lang){
  const key = interestKey(); if (!key) return null;
  const g = S.wsGen[l]; if (g && g.key === key) return {src:'x' + g.stamp, ...g.data};
  const h = interests().ids[0]; if (h && WS_BANK[h]) return {src:'b' + h, ...bankSet(h, l)};
  return null;
}
function wsGenPrompt(l){
  const P = S.profile, it = interests();
  return `You are preparing personalised practice exercises for someone who is learning to use an AI assistant called Claude. Write every text value in ${I18N[l].langName}.
About the person (fields may be empty): interests: ${[...it.ids.map(h => I18N.en.hobbies[h]), it.other].filter(Boolean).join(', ') || '-'}; work: ${P.role || '-'}; something they want to get done: ${P.plan || '-'}.
Every exercise must be about their interests, in everyday situations.
Return ONLY one JSON object, no other text, exactly in this shape:
{"quiz":[{"tool":"chat","situation":"...","why":"..."}],"fix":{"weak":"...","options":["...","...","..."],"best":1,"why":"..."},"preset":{"name":"...","context":"...","task":"...","constraints":"...","output":"..."},"checklist":[{"stage":"...","text":"..."}]}
Rules:
- "quiz": 3 items. "tool" is one of "chat" (a conversation to think, decide or draft), "projects" (a workspace whose instructions and files every conversation reuses), "cowork" (works on files in a connected folder, runs scheduled tasks, publishes pages), "code" (Claude Code, for a software project). Use at least 2 different tools. "situation": one or two short sentences. "why": one sentence on why that tool fits.
- "fix": "weak" is a vague one-line request about their interests. "options" are 3 rewrites: exactly one is clear and specific (context, task, constraints, format), the other two stay vague. "best" is the index (0, 1 or 2) of the good one. "why": one sentence.
- "preset": a realistic four-part brief about their interests. "name": 2 to 4 words. "task" starts with a verb. Each other field is one or two sentences.
- "checklist": 2 concrete things to try with Claude this month about their interests. "stage": 1 to 3 words. "text": one sentence starting with a verb.
- Never mention real people or brands.`;
}
function wsParseGen(txt){
  if (!txt) return null;
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}'); if (a < 0 || b <= a) return null;
  let o; try{ o = JSON.parse(txt.slice(a, b + 1)); }catch(e){ return null; }
  const str = (v, max) => typeof v === 'string' && v.trim() ? v.trim().slice(0, max) : null;
  const quiz = (Array.isArray(o.quiz) ? o.quiz : []).map(x => x && WS_TOOLS[x.tool] && str(x.situation, 300) && str(x.why, 300) ? {a:x.tool, q:str(x.situation, 300), why:str(x.why, 300)} : null).filter(Boolean).slice(0, 3);
  const f = o.fix || {}, opts = Array.isArray(f.options) ? f.options.map(v => str(v, 500)).filter(Boolean) : [];
  const fix = str(f.weak, 200) && opts.length === 3 && [0,1,2].includes(f.best) && str(f.why, 300) ? {a:f.best, weak:str(f.weak, 200), opts, why:str(f.why, 300)} : null;
  const pr = o.preset || {}, pk = ['name','context','task','constraints','output'];
  const preset = pk.every(k => str(pr[k], 400)) ? Object.fromEntries(pk.map(k => [k, str(pr[k], k === 'name' ? 40 : 400)])) : null;
  const check = (Array.isArray(o.checklist) ? o.checklist : []).map(x => x && str(x.stage, 30) && str(x.text, 200) ? {stage:str(x.stage, 30), text:str(x.text, 200)} : null).filter(Boolean).slice(0, 2);
  if (quiz.length < 2 || !fix || !preset || !check.length) return null;
  return {quiz, fix, preset, check};
}
async function wsEnsurePersonal(){
  const key = interestKey(), l = lang;
  if (!key || !S.sample || (S.wsGen[l] && S.wsGen[l].key === key) || S.wsPending[l] === key) return;
  S.wsPending[l] = key; wsNotice();
  try{
    const res = await S.sample(wsGenPrompt(l), {cache:false, modelTier:'quick'});
    const data = wsParseGen(res && res.text);
    // Keep the pre-written set if the person already started answering it.
    const bankSrc = 'b' + (interests().ids[0] || '') + ':';
    const started = ['quiz','fix','check'].some(k => Object.keys(S.wsAns[k]).some(x => x.startsWith(bankSrc)));
    if (data && interestKey() === key && !started){
      S.wsGen[l] = {key, stamp:Date.now().toString(36), data};
      if (S.view === 'workshop' && lang === l){ renderWorkshop(); toast(wt('adapted')); }
    }
  }catch(err){ if (err && err.code === 'not_granted') S.sample = null; }
  finally{ if (S.wsPending[l] === key) delete S.wsPending[l]; if (S.view === 'workshop') wsNotice(); }
}

function wsSwapPreset(prev, next){

}

/* ---------- rank ---------- */
function wsScore(){
  const quiz = wsQuizList(), fix = wsFixList(), check = wsCheckList();
  const right = (kind, list) => list.filter(x => ansGet(kind, x.key) === x.a).length;
  const points = right('quiz', quiz)*2 + right('fix', fix)*2 + Object.keys(W.known).length
    + check.filter(x => ansGet('check', x.key)).length*2 + (W.reviewed ? 3 : 0) + (W.chatted ? 3 : 0);
  const max = quiz.length*2 + fix.length*2 + WS_WORDS.length + check.length*2 + 6;
  const answered = (kind, list) => list.filter(x => ansGet(kind, x.key) !== undefined).length;
  return {points, max, quiz:[answered('quiz', quiz), quiz.length], fix:[answered('fix', fix), fix.length], check:[check.filter(x => ansGet('check', x.key)).length, check.length]};
}
function wsRank(){
  if (!$('#wsRankTitle')) return;
  const sc = wsScore(), p = sc.points; let r = WS_RANKS[0], nx = WS_RANKS[1];
  WS_RANKS.forEach((x,i) => { if (p >= x[0]){ r = x; nx = WS_RANKS[i+1] || null; } });
  $('#wsRankTitle').textContent = r[1][lang];
  $('#wsRankAlt').textContent = lang === 'en' ? `FR : ${r[1].fr.toLowerCase()} · ES: ${r[1].es.toLowerCase()}` : `EN: ${r[1].en.toLowerCase()}`;
  $('#wsRankPts').textContent = `${p} / ${sc.max} ${wt('pts')}`;
  $('#wsRankNext').textContent = nx ? `${nx[1][lang]} ${wt('at')} ${nx[0]}` : wt('top');
  $('#wsRankBar').style.width = Math.round(p / sc.max * 100) + '%';
  const set = (id, [a, b]) => { $('#wsc-' + id).textContent = a + '/' + b; $('#wst-' + id).classList.toggle('done', a === b); };
  set('quiz', sc.quiz); set('fix', sc.fix); set('words', [Object.keys(W.known).length, WS_WORDS.length]); set('site', sc.check);
  $('#wsc-builder').textContent = W.reviewed ? '✓' : ''; $('#wst-builder').classList.toggle('done', W.reviewed);
}

/* ---------- coach: multi-turn answers in the main chat ---------- */
const COACH_RULES = `You are Claude, a friendly, practical coach inside an interactive onboarding page that teaches beginners how to work well with an AI assistant.
The person you're talking to may be new to AI. You know nothing about them except what they tell you: don't assume their job, country or situation; ask one short question if it matters.
Products covered by the page: Chat (conversations), Projects (a workspace with instructions and files that every conversation in it can use), memory, Cowork (works on local folders, publishes pages and docs, runs scheduled tasks, can use a browser), Claude Code (for software projects).
How to answer: short and practical (under 180 words unless asked). Use concrete, everyday examples. Use short bullet lists when useful. If you are unsure about a product feature, say so rather than inventing it. For legal, medical, tax or financial questions, give general information and recommend checking with a professional.`;
const COACH_LANG = {
  es:'\nResponde en español de España, de forma sencilla y clara (tuteo). Cuando te pida texto en inglés, dáselo en inglés con su traducción.',
  fr:'\nRéponds en français, simplement et clairement (tutoiement). Quand on te demande du texte en anglais, donne-le en anglais avec sa traduction.',
  en:'\nAnswer in clear, simple English.'
};
const COACH_TR = {
  es:'\n\nAfter your Spanish answer, add a line containing only "--- EN ---" and then a faithful English translation of your answer, so the reader can learn the English vocabulary.',
  fr:'\n\nAfter your French answer, add a line containing only "--- EN ---" and then a faithful English translation of your answer, so the reader can learn the English vocabulary.',
  en:'\n\nAfter your English answer, add a line containing only "--- FR ---" and then a faithful French translation of your answer, so the reader can check it and learn the vocabulary.'
};
const SEP_LABEL = {FR:'FRANÇAIS', EN:'ENGLISH', ES:'ESPAÑOL'};
function coachMd(txt){
  const lines = esc(txt).split('\n'); let out = '', inList = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^#{1,4}\s*(.+)$/,'<strong>$1</strong>');
  for (const l of lines){
    const sep = l.match(/^\s*---\s*(FR|EN|ES)\s*---\s*$/i);
    if (sep){ if (inList){ out += '</ul>'; inList = false; } out += `<span class="coach-sep">${SEP_LABEL[sep[1].toUpperCase()]}</span>`; continue; }
    const m = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m){ if (!inList){ out += '<ul>'; inList = true; } out += `<li>${inline(m[1])}</li>`; continue; }
    if (inList){ out += '</ul>'; inList = false; }
    if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  if (inList) out += '</ul>';
  return out;
}
const coachTurns = []; let coachCtl = null;
async function askCoach(text){
  text = String(text || '').trim(); if (!text || S.busy) return;
  showChat(); document.body.classList.remove('side-open');
  addMsg('user', coachMd(text));
  const bubble = addMsg('claude', '<span class="typing"><i></i><i></i><i></i></span>');
  const scroll = () => { $('#thread').scrollTop = $('#thread').scrollHeight; };
  if (!S.sample){ bubble.innerHTML = `<p>${esc(wt('coachOff'))}</p>`; scroll(); return; }
  coachTurns.push({role:'user', content:text});
  while (coachTurns.length > 16) coachTurns.splice(0, 2);
  S.busy = true; coachCtl = new AbortController(); setSendState();
  const rules = COACH_RULES + `\nWhat you know about the person: ${S.instructions || buildInstructions()}` + COACH_LANG[lang] + (W.tr ? COACH_TR[lang] : '');
  try{
    const res = await S.sample([{role:'user', content:rules}, ...coachTurns], {cache:false, signal:coachCtl.signal, onText:({text}) => { bubble.innerHTML = coachMd(text); scroll(); }});
    bubble.innerHTML = coachMd(res.text) + (res.truncated ? `<p><em>${esc(wt('cut'))}</em></p>` : '');
    coachTurns.push({role:'assistant', content:res.text});
    if (!W.chatted){ W.chatted = true; wsSave(); wsRank(); }
  }catch(err){
    const code = (err && err.code) || 'upstream_error';
    if (code === 'cancelled'){
      bubble.innerHTML = (err.text ? coachMd(err.text) : '') + `<p><em>${esc(wt('stopped'))}</em></p>`;
      if (err.text) coachTurns.push({role:'assistant', content:err.text}); else coachTurns.pop();
    } else {
      const partial = err.text && code !== 'refused' ? coachMd(err.text) + `<p><em>${esc(wt('interrupted'))}</em></p>` : '';
      coachTurns.pop();
      bubble.innerHTML = partial + `<p class="coach-err">${esc(wt('err')[code] || wt('err').upstream_error)}</p>`;
      if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)) S.sample = null;
    }
  }finally{
    S.busy = false; coachCtl = null; setSendState(); scroll();
  }
}

    () => `# La inteligencia artificial, explicada fácil\nImagina a alguien que ha leído muchísimos libros, webs y conversaciones. De tanto leer, ha aprendido cómo suelen encajar las palabras y las ideas.\n\`\`\`diagram\n{"type":"compare","title":"Sus puntos fuertes y débiles","left":{"title":"Hace bien","items":["Escribir y resumir","Explicar paso a paso","Dar ideas"]},"right":{"title":"Hace peor","items":["A veces se equivoca","No sabe lo que no le cuentas"]}}\n\`\`\`\n## Por qué revisar lo importante\nPuede sonar muy segura aunque se equivoque, así que conviene comprobar datos y fechas que importen.\n## Cómo usarla\nHáblale como a una persona: explícale qué necesitas y para qué.`,
    () => `# 5 ideas para un regalo original\n1. **Una experiencia juntos:** una clase de cocina, de cerámica o una cata.\n2. **Un álbum de recuerdos** con fotos y notas escritas a mano.\n3. **Una suscripción** a algo que le encante: libros, café o flores.\n4. **Algo hecho por ti:** una receta especial, una lista de canciones o una carta.\n5. **Un vale** con planes para hacer juntos durante el año.\n## Para acertar más\nCuéntame sus gustos y te propongo ideas más concretas.`

    n => `# Mail pour demander un jour de congé\n\`\`\`diagram\n{"type":"flow","title":"Comment il est construit","items":["Un objet clair","La demande, dès le début","Comment ton travail sera couvert","Une fin ouverte et cordiale"]}\n\`\`\`\n**Objet :** Demande de congé le [date]\n\nBonjour [prénom],\n\nJe vous écris pour vous demander un jour de congé le [date]. J’ai organisé mon travail pour que rien ne reste en suspens : [tâche] sera terminée avant et [collègue] peut gérer les urgences.\n\nEst-ce que cela vous convient ? Si un autre jour vous arrange davantage, n’hésitez pas à me le dire.\n\nBien cordialement,\n${n || '[ton prénom]'}`,
    () => `# L’intelligence artificielle, expliquée simplement\nImagine quelqu’un qui aurait lu une quantité énorme de livres, de sites et de conversations. À force de lire, il a appris comment les mots et les idées s’enchaînent d’habitude.\n\`\`\`diagram\n{"type":"compare","title":"Points forts et points faibles","left":{"title":"Fait bien","items":["Écrire et résumer","Expliquer pas à pas","Donner des idées"]},"right":{"title":"Fait moins bien","items":["Se trompe parfois","Ignore ce que tu ne dis pas"]}}\n\`\`\`\n## Pourquoi vérifier ce qui compte\nElle peut avoir l’air très sûre d’elle même quand elle se trompe : vérifie les chiffres et les dates importants.\n## Comment t’en servir\nParle-lui comme à une personne : explique ce dont tu as besoin et pourquoi.`,
    () => `# 5 idées de cadeau original\n1. **Une expérience à partager :** un cours de cuisine, de poterie ou une dégustation.\n2. **Un album souvenir** avec des photos et des mots écrits à la main.\n3. **Un abonnement** à quelque chose que la personne adore : livres, café ou fleurs.\n4. **Quelque chose fait par toi :** une recette spéciale, une playlist ou une lettre.\n5. **Un bon** pour des sorties à faire ensemble pendant l’année.\n## Pour viser juste\nDis-moi ce que la personne aime et je te propose des idées plus précises.`

function scripted(idx, task){
  const n = S.profile.name;
  if (idx >= 0) return SCRIPT[lang][idx](n);
  return ({
    es:`# ${task}\nAquí tendrías el resultado completo de tu petición.\n## Cómo seguir\n- Pídeme cambios con tus palabras: «más corto», «más formal», «añade un ejemplo»\n- Si algo no encaja, dímelo y lo ajusto`,
    fr:`# ${task}\nC’est ici qu’apparaîtrait le résultat complet de ta demande.\n## Pour continuer\n- Demande-moi des modifications avec tes mots : « plus court », « plus formel », « ajoute un exemple »\n- Si quelque chose ne va pas, dis-le-moi et je l’ajuste`,
    en:`# ${task}\nThis is where the full result of your request would appear.\n## How to continue\n- Ask me for changes in your own words: “shorter”, “more formal”, “add an example”\n- If something doesn’t fit, tell me and I’ll adjust it`
  })[lang];
}

/* ================= static text ================= */
function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-mascot]').forEach(el => el.innerHTML = mascot());
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('#input').placeholder = t('placeholder');
  $('#greet').textContent = S.profile.name ? t('greetName',{name:S.profile.name}) : t('greet');
  renderCrumb();
}
function renderCrumb(){
  const c = $('#crumb');
  c.innerHTML = S.project ? `<span>${esc(t('projects'))}</span><span class="pill">${esc(S.project)}</span>` : '';
}

/* ================= welcome ================= */
function showWelcome(){
  const w = $('#welcome');
  w.innerHTML = `<div class="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle">
    <div class="lang" role="group" aria-label="Idioma · Langue · Language">${LANGS.map(l => `<button data-lang="${l}" aria-pressed="${lang===l}">${l.toUpperCase()}</button>`).join('')}</div>

    <h1 id="wTitle">${esc(t('wTitle'))}</h1>
    <p>${esc(t('wBody'))}</p>
    <p class="w-steps-title">${esc(t('wStepsTitle'))}</p>
    <ol class="w-steps">${L().steps.filter((s,i) => !(isSlow() && i === 3)).map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <p class="w-time">${esc(isFast() ? t('wTimeFast') : t('wTime'))}</p>
    <div class="w-prefs"><p class="w-steps-title">${esc(t('prefTitle'))}</p>${prefChips()}<p class="w-time">${esc(t('prefHint'))}</p></div>
    <div class="actions">
      <button class="btn btn-primary" data-w="start">${esc(t('start'))}</button>

    </div>
    <p class="w-recall more">${esc(t('wRecall'))}</p>
  </div>`;
  w.hidden = false;
  // Focus without scrolling: on short screens that would hide the title and the language buttons.
  const box = w.querySelector('.welcome'); box.scrollTop = 0;
  setTimeout(() => { w.querySelector('[data-w="start"]')?.focus({preventScroll:true}); box.scrollTop = 0; }, 50);
}
$('#welcome').addEventListener('click', e => {
  const l = e.target.closest('[data-lang]');
  if (l){ setLang(l.dataset.lang); showWelcome(); return; }
  const a = e.target.closest('[data-w]'); if (!a) return;
  $('#welcome').hidden = true;
  if (a.dataset.w === 'start'){ S.started = true; S.step = 'first'; openGuide(); }
  else { toast(t('skipped')); pulse($('#guideItem')); }
});

/* ================= coach ================= */
function openGuide(){ S.guideOpen = true; document.body.classList.remove('coach-min'); renderCoach(); }
function closeGuide(){ S.guideOpen = false; renderCoach(); }

function renderCoach(){
  const c = $('#coach');
  document.body.classList.toggle('guide-on', S.guideOpen);
  if (!S.guideOpen){ c.hidden = true; return; }
  c.hidden = false;
  c.classList.toggle('min', document.body.classList.contains('coach-min'));
  const p = PROGRESS[S.step] || 0;
  const thinking = (S.step === 'working' || S.step === 'tweaking' || S.step === 'missionWorking')
    ? 'thinking'
    : (S.step === 'done' || S.step === 'missionDone')
      ? 'celebrate'
      : (S.step === 'artifact' || S.step === 'tweaked')
        ? 'happy'
        : (S.step === 'know' || S.step === 'remember')
          ? 'gentle'
          : '';
  c.innerHTML = `
    <div class="coach-head">
      ${canGoBack() ? `<button class="icon-btn coach-back" data-a="back" aria-label="${esc(t('back'))}" title="${esc(t('back'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>` : ''}
      <div class="coach-mascot">${mascot(thinking)}</div>
      <div class="coach-meta"><span class="coach-name">Claude</span><span class="coach-step">${S.step.startsWith('mission') && mission(S.mission) ? esc(t('pgDay',{d:mission(S.mission).day})) : p ? esc(t('stepOf',{n:Math.min(p,totalSteps()),total:totalSteps()})) : esc(t('guide'))}</span></div>
      <button class="icon-btn only-mobile" data-a="min" aria-label="${esc(t('minimize'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="${document.body.classList.contains('coach-min') ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6'}"/></svg></button>
      <button class="icon-btn" data-a="skip" aria-label="${esc(t('skipGuide'))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    ${S.step.startsWith('mission') ? '' : `<div class="progress" style="grid-template-columns:repeat(${totalSteps()},1fr)">${Array.from({length:totalSteps()},(_,k)=>k+1).map(i => `<i class="${i <= p ? 'on' : ''}"></i>`).join('')}</div>`}
    <div class="coach-body">${body()}</div>`;
}

function buildInstructions(){
  const P = S.profile; let s = '';
  if (P.name) s += t('instrName',{name:P.name});
  if (P.role) s += t('instrRole',{role:P.role});
  if (P.plan) s += t('instrPlan',{plan:P.plan});
  if (P.goals.length) s += t('instrGoal',{goals:P.goals.map(i => L().goals[i].toLowerCase()).join(', ')});

function mdToHtml(md){
  const lines = md.replace(/\r/g,'').split('\n');
  let out = '', list = null, title = '';
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const close = () => { if (list){ out += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i].trim();
    if (/^```/.test(l)){
      close();
      const isDiag = /^```\s*diagram/i.test(l);
      let j = i + 1; const buf = [];
      while (j < lines.length && !/^```/.test(lines[j].trim())){ buf.push(lines[j]); j++; }
      const closed = j < lines.length;
      if (isDiag) out += closed ? diagramHtml(buf.join('\n')) : '<div class="diagram"><div class="skeleton" style="height:140px;max-width:460px"></div></div>';
      i = closed ? j : lines.length;
      continue;
    }
    if (!l){ close(); continue; }
    if (/^#\s/.test(l) && !title){ title = l.replace(/^#\s+/,''); continue; }
    if (/^#{2,}\s/.test(l)){ close(); out += `<h3>${inline(l.replace(/^#+\s+/,''))}</h3>`; continue; }
    if (/^[-*]\s/.test(l)){ if (list !== 'ul'){ close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(l.slice(2))}</li>`; continue; }
    if (/^\d+[.)]\s/.test(l)){ if (list !== 'ol'){ close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(l.replace(/^\d+[.)]\s+/,''))}</li>`; continue; }
    close(); out += `<p>${inline(l)}</p>`;
  }
  close();
  return {title, html: out};
}

/* ---------- diagrams (drawn as SVG from a small JSON spec) ---------- */
function wrapText(text, max){
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words){
    if ((cur + ' ' + w).trim().length > max && cur){ lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}
function tspans(lines, x, y, lh){ return lines.map((ln,k) => `<tspan x="${x}" y="${y + k*lh}">${esc(ln)}</tspan>`).join(''); }
function diagramHtml(json){
  let d; try{ d = JSON.parse(json); }catch(e){ return ''; }
  let svg = '';
  if (d.type === 'flow' && Array.isArray(d.items)) svg = svgFlow(d.items.slice(0,6));
  else if (d.type === 'compare' && d.left && d.right) svg = svgCompare(d);
  if (!svg) return '';
  return `<figure class="diagram">${d.title ? `<figcaption>${esc(d.title)}</figcaption>` : ''}${svg.replace('<svg ', `<svg role="img" aria-label="${esc(d.title || '')}" `)}</figure>`;
}
function svgFlow(items){
  const W = 320, LH = 18, GAP = 22; let y = 2, body = '';
  items.forEach((it, i) => {
    const lines = wrapText(it, 30);
    const h = Math.max(46, lines.length*LH + 24);
    body += `<rect x="2" y="${y}" width="${W-4}" height="${h}" rx="12" style="fill:var(--bg);stroke:var(--line)"/>`;
    body += `<circle cx="28" cy="${y + h/2}" r="13" style="fill:var(--accent-soft)"/>`;
    body += `<text x="28" y="${y + h/2 + 5}" text-anchor="middle" style="fill:var(--accent);font-weight:700;font-size:13px">${i+1}</text>`;
    const ty = y + h/2 - ((lines.length-1)*LH)/2 + 5;
    body += `<text style="fill:var(--ink);font-size:14px">${tspans(lines, 52, ty, LH)}</text>`;
    y += h;
    if (i < items.length - 1){
      body += `<path d="M${W/2} ${y+4} V${y+GAP-6}" style="stroke:var(--muted);stroke-width:1.6;fill:none"/>`;
      body += `<path d="M${W/2-5} ${y+GAP-10} L${W/2} ${y+GAP-4} L${W/2+5} ${y+GAP-10}" style="stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round"/>`;
      y += GAP;
    }
  });
  return `<svg viewBox="0 0 ${W} ${y+2}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
function svgCompare(d){
  const W = 320, CW = 152, LH = 17;
  const col = (c, x) => {
    const head = wrapText(c.title || '', 16);
    const hh = head.length*LH + 20;
    let parts = `<rect x="${x}" y="2" width="${CW}" height="${hh}" rx="12" style="fill:var(--accent-soft)"/>`;
    parts += `<text style="fill:var(--accent);font-weight:700;font-size:14px">${tspans(head, x+14, 2 + 10 + LH - 3, LH)}</text>`;
    let y = hh + 16;
    (c.items || []).slice(0,4).forEach(it => {
      const ls = wrapText(it, 17);
      parts += `<circle cx="${x+18}" cy="${y-4}" r="3" style="fill:var(--mascot)"/>`;
      parts += `<text style="fill:var(--ink);font-size:13px">${tspans(ls, x+28, y, LH)}</text>`;
      y += ls.length*LH + 10;
    });
    return {parts, h: y};
  };
  const a = col(d.left, 2), b = col(d.right, 2 + CW + 12);
  const H = Math.max(a.h, b.h) + 4;
  const bg = x => `<rect x="${x}" y="2" width="${CW}" height="${H-4}" rx="12" style="fill:var(--bg);stroke:var(--line)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${bg(2)}${bg(2+CW+12)}${a.parts}${b.parts}</svg>`;
}

async function fakeStream(md, onText){

    acc += words[i];
    if (!reduce && i % 6 === 0){ onText(acc); await new Promise(r => setTimeout(r, 40)); }
  }
  onText(acc);
  return acc;
}

function reviseFallback(md, idx, instr){
  const lines = md.split('\n');
  if (idx === 0){
    let out = [], rest = [], fence = false;
    for (const l of lines){
      const tl = l.trim();
      if (/^```/.test(tl)){ fence = !fence; out.push(l); continue; }
      if (fence || /^#\s/.test(tl)){ out.push(l); continue; }
      if (tl) rest.push(l);
    }
    return out.concat(['', ...rest.slice(0, Math.max(2, Math.ceil(rest.length*0.5)))]).join('\n');
  }
  if (idx === 1) return md + '\n\n' + t('tipExtra');
  if (idx === 2) return lines.map(l => /^#\s/.test(l.trim()) && !l.startsWith('##') ? '# ✨ ' + t('funTitle',{t:l.replace(/^#\s+/,'')}) : l).join('\n');

}
